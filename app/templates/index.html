<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Virtual Dart Motion</title>
  <link rel="stylesheet" href="/static/style.css">

  <style>
    .cross-board {
      position: relative;
    }

    #endpointMarker {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ff3030;
      border: 2px solid #ffffff;
      box-shadow:
        0 0 10px #ff3030,
        0 0 20px #ff3030,
        0 0 34px rgba(255, 48, 48, 0.8);
      transform: translate(-50%, -50%);
      z-index: 20;
      display: none;
      pointer-events: none;
    }

    #endpointMarker::after {
      content: "endpoint";
      position: absolute;
      left: 24px;
      top: -10px;
      color: #ff5555;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      text-shadow:
        0 0 6px rgba(255, 48, 48, 0.8);
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Virtual Dart Motion</h1>
    <p>AI Motion Based Dart Game</p>
  </div>

  <div class="dashboard">

    <!-- LEFT -->
    <div>
      <div class="panel">

        <h2>System Status</h2>

        <input
          type="text"
          id="player1Name"
          placeholder="PLAYER 1 NAME">

        <input
          type="text"
          id="player2Name"
          placeholder="PLAYER 2 NAME">

        <div class="upload-box">
          <form id="uploadForm">
            <button
              type="submit"
              id="startButton">
              START ANALYSIS
            </button>
          </form>

          <div id="loading"></div>
        </div>

        <button
          class="reset-button"
          onclick="resetGame()">
          RESET GAME
        </button>

        <div class="result-box">
          <h3>Analysis Status</h3>
          <p id="statusText">READY</p>
        </div>

        <div class="result-box">
          <h3>Latest Video</h3>
          <p id="videoText">WAITING</p>
        </div>

        <div class="result-box">
          <h3>Last Throw Result</h3>
          <p id="hitText">NO DATA</p>
        </div>

      </div>
    </div>

    <!-- CENTER -->
    <div>
      <div class="panel">

        <h2>Smart Target Board</h2>

        <div
          class="cross-board"
          id="crossBoard">

          <div
            id="target-top"
            class="target-circle">
            TOP
          </div>

          <div class="middle-row">

            <div
              id="target-left"
              class="target-circle">
              LEFT
            </div>

            <div
              id="target-center"
              class="target-circle center">
              CENTER
            </div>

            <div
              id="target-right"
              class="target-circle">
              RIGHT
            </div>

          </div>

          <div
            id="target-bottom"
            class="target-circle">
            BOTTOM
          </div>

          <div id="endpointMarker"></div>

        </div>

      </div>
    </div>

    <!-- RIGHT -->
    <div>
      <div class="panel">

        <h2>Game Status</h2>

        <div class="player-box">
          <p>현재 플레이어</p>
          <h3
            class="turn"
            id="currentPlayerText">
            PLAYER 1
          </h3>
        </div>

        <div class="player-box">
          <p>현재 ROUND</p>
          <h3
            class="turn"
            id="roundText">
            ROUND 1 / 3
          </h3>
        </div>

        <div class="player-box">
          <p>현재 점수</p>

          <div class="score">
            <div>
              <span id="p1Label">P1</span> :
              <span id="player1Score">0</span>
            </div>

            <div>
              <span id="p2Label">P2</span> :
              <span id="player2Score">0</span>
            </div>
          </div>
        </div>

        <div class="player-box">
          <p>WINNER</p>
          <h3
            class="turn"
            id="winnerText">
            -
          </h3>
        </div>

      </div>
    </div>

  </div>

</div>

<script>

let currentPlayer = 1;
let currentRound = 1;
const MAX_ROUND = 3;

const SCREEN_WIDTH = 1920;
const SCREEN_HEIGHT = 1080;

let gameEnded = false;

let playerScores = {
  1: 0,
  2: 0
};

function clearTargetHighlight() {

  document
    .querySelectorAll(".target-circle")
    .forEach(target => {
      target.classList.remove("active");
    });

}

function clearEndpointMarker() {

  const marker =
    document.getElementById("endpointMarker");

  marker.style.display = "none";

}

function activateTarget(target) {

  clearTargetHighlight();

  if (!target) {
    return;
  }

  const normalizedTarget =
    String(target).toLowerCase();

  const selected =
    document.getElementById(
      `target-${normalizedTarget}`
    );

  if (selected) {
    selected.classList.add("active");
  }

}

function showEndpointMarker(endpointXPx, endpointYPx) {

  if (
    endpointXPx === undefined ||
    endpointYPx === undefined ||
    endpointXPx === null ||
    endpointYPx === null
  ) {
    clearEndpointMarker();
    return;
  }

  const board =
    document.getElementById("crossBoard");

  const marker =
    document.getElementById("endpointMarker");

  const boardRect =
    board.getBoundingClientRect();

  const xRatio =
    Number(endpointXPx) / SCREEN_WIDTH;

  const yRatio =
    Number(endpointYPx) / SCREEN_HEIGHT;

  const markerX =
    Math.max(
      0,
      Math.min(
        boardRect.width,
        boardRect.width * xRatio
      )
    );

  const markerY =
    Math.max(
      0,
      Math.min(
        boardRect.height,
        boardRect.height * yRatio
      )
    );

  marker.style.left =
    `${markerX}px`;

  marker.style.top =
    `${markerY}px`;

  marker.style.display =
    "block";

}

function getTargetFromLegacyHit(hitX, hitY) {

  if (hitX === undefined || hitY === undefined) {
    return "center";
  }

  const x = Number(hitX);
  const y = Number(hitY);

  if (x <= 4) {
    return "left";
  }

  if (x >= 11) {
    return "right";
  }

  if (y <= 5) {
    return "top";
  }

  if (y >= 10) {
    return "bottom";
  }

  return "center";

}

function scoreFromTarget(target) {

  const normalizedTarget =
    String(target).toLowerCase();

  if (normalizedTarget === "center") {
    return 100;
  }

  if (
    normalizedTarget === "top" ||
    normalizedTarget === "left" ||
    normalizedTarget === "right" ||
    normalizedTarget === "bottom"
  ) {
    return 70;
  }

  return 0;

}

function showScorePopup(score) {

  const popup =
    document.createElement("div");

  popup.classList.add("score-popup");
  popup.innerText = `+${score}`;

  popup.style.left =
    `${window.innerWidth / 2}px`;

  popup.style.top =
    `${window.innerHeight / 2}px`;

  document.body.appendChild(popup);

  setTimeout(() => {
    popup.remove();
  }, 1000);

}

function updateCurrentPlayerName() {

  const p1 =
    document.getElementById("player1Name")
      .value
      .trim();

  const p2 =
    document.getElementById("player2Name")
      .value
      .trim();

  if (currentPlayer === 1) {
    document.getElementById("currentPlayerText").innerText =
      p1 || "PLAYER 1";
  }
  else {
    document.getElementById("currentPlayerText").innerText =
      p2 || "PLAYER 2";
  }

}

function finishGame() {

  gameEnded = true;

  let winner = "DRAW";

  if (playerScores[1] > playerScores[2]) {
    winner =
      document.getElementById("p1Label").innerText;
  }
  else if (playerScores[2] > playerScores[1]) {
    winner =
      document.getElementById("p2Label").innerText;
  }

  const winnerText =
    document.getElementById("winnerText");

  winnerText.innerText = winner;
  winnerText.classList.add("game-over");

  document.getElementById("statusText").innerText =
    "GAME OVER";

}

function resetGame() {

  currentPlayer = 1;
  currentRound = 1;
  gameEnded = false;

  playerScores = {
    1: 0,
    2: 0
  };

  document.getElementById("player1Score").innerText = 0;
  document.getElementById("player2Score").innerText = 0;

  document.getElementById("winnerText").innerText = "-";
  document.getElementById("winnerText")
    .classList.remove("game-over");

  updateCurrentPlayerName();

  document.getElementById("roundText").innerText =
    "ROUND 1 / 3";

  document.getElementById("statusText").innerText =
    "READY";

  document.getElementById("hitText").innerText =
    "NO DATA";

  document.getElementById("videoText").innerText =
    "WAITING";

  document.getElementById("loading").innerText =
    "";

  clearTargetHighlight();
  clearEndpointMarker();

}

document
  .getElementById("player1Name")
  .addEventListener(
    "input",
    updateCurrentPlayerName
  );

document
  .getElementById("player2Name")
  .addEventListener(
    "input",
    updateCurrentPlayerName
  );

const form =
  document.getElementById("uploadForm");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  if (gameEnded) {
    alert("게임이 종료되었습니다.");
    return;
  }

  const startButton =
    document.getElementById("startButton");

  startButton.disabled = true;
  startButton.innerText = "ANALYZING...";

  clearEndpointMarker();

  const p1 =
    document.getElementById("player1Name").value.trim();

  const p2 =
    document.getElementById("player2Name").value.trim();

  document.getElementById("p1Label").innerText =
    p1 || "P1";

  document.getElementById("p2Label").innerText =
    p2 || "P2";

  document.getElementById("loading").innerText =
    "ADB CAMERA RECORDING...";

  document.getElementById("statusText").innerText =
    "CAPTURING VIDEO";

  try {

    const response =
      await fetch("/analyze", {
        method: "POST"
      });

    const data =
      await response.json();

    if (!data.success) {

      document.getElementById("statusText").innerText =
        "ERROR";

      document.getElementById("loading").innerText =
        data.error || "UNKNOWN ERROR";

      startButton.disabled = false;
      startButton.innerText = "START ANALYSIS";

      return;

    }

    document.getElementById("loading").innerText =
      "AI ANALYZING MOTION...";

    document.getElementById("statusText").innerText =
      "PROCESSING";

    document.getElementById("videoText").innerText =
      data.video_name || "UNKNOWN VIDEO";

    const target =
      data.target || getTargetFromLegacyHit(
        data.hit_x,
        data.hit_y
      );

    activateTarget(target);

    showEndpointMarker(
      data.endpoint_x_px,
      data.endpoint_y_px
    );

    const score =
      scoreFromTarget(target);

    showScorePopup(score);

    playerScores[currentPlayer] += score;

    document.getElementById("player1Score").innerText =
      playerScores[1];

    document.getElementById("player2Score").innerText =
      playerScores[2];

    const endpointText =
      (
        data.endpoint_x_px !== undefined &&
        data.endpoint_y_px !== undefined
      )
        ? ` / ENDPOINT : (${Number(data.endpoint_x_px).toFixed(1)}, ${Number(data.endpoint_y_px).toFixed(1)})`
        : "";

    const distanceText =
      data.distance_px !== undefined && data.distance_px !== null
        ? ` / DISTANCE : ${Number(data.distance_px).toFixed(1)}px`
        : "";

    document.getElementById("hitText").innerText =
      `TARGET : ${String(target).toUpperCase()}${endpointText}${distanceText}`;

    document.getElementById("statusText").innerText =
      "BOARD UPDATED";

    document.getElementById("loading").innerText =
      "ANALYSIS COMPLETE";

    if (currentPlayer === 1) {
      currentPlayer = 2;
    }
    else {
      currentPlayer = 1;
      currentRound++;

      document.getElementById("roundText").innerText =
        `ROUND ${currentRound} / ${MAX_ROUND}`;
    }

    const currentPlayerText =
      document.getElementById("currentPlayerText");

    currentPlayerText.classList.remove("turn-active");

    void currentPlayerText.offsetWidth;

    currentPlayerText.classList.add("turn-active");

    updateCurrentPlayerName();

    if (currentRound > MAX_ROUND) {
      finishGame();
    }

  }
  catch (error) {

    console.error(error);

    document.getElementById("statusText").innerText =
      "SERVER ERROR";

    document.getElementById("loading").innerText =
      "FAILED";

  }

  startButton.disabled = false;
  startButton.innerText = "START ANALYSIS";

});

</script>

</body>
</html>
